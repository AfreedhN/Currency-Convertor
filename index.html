<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Currency Convertor </title>
    <link rel="stylesheet" href="./index.css">
</head>
<body>
    
    <div class="container">
        <h1> Currency Convertor </h1>
        <section class="currency-part"> 
            <input type="number" id="first-currency">
            <select id="selected-currency">
                <option value="INR"> INR </option>
                <option value="USD"> USD </option>
                <option value="EUR"> EUR </option>
                <option value="JPY"> JPY </option>
                <option value="GBP"> GBP </option>
                <option value="AUD"> AUD </option>
                <option value="BRL"> BRL </option>
                <option value="CAD"> CAD </option>
                <option value="CNY"> CNY </option>
                <option value="EGP"> EGP </option>
                <option value="IDR"> IDR </option>
                <option value="RUB"> RUB </option>
            </select>
        </section>
        <section class="currency-part"> 
            <input type="number" id="second-currency">
            <select id="convert-currency">
                <option value="USD"> USD </option>
                <option value="INR"> INR </option>
                <option value="EUR"> EUR </option>
                <option value="JPY"> JPY </option>
                <option value="GBP"> GBP </option>
                <option value="AUD"> AUD </option>
                <option value="BRL"> BRL </option>
                <option value="CAD"> CAD </option>
                <option value="CNY"> CNY </option>
                <option value="EGP"> EGP </option>
                <option value="IDR"> IDR </option>
                <option value="RUB"> RUB </option>
            </select>
        </section>

        <p class="exchange-currency" id="exchange-currency"> 1INR = 94 USD </p>

    </div>

    <script src="./index.js"></script>
</body>
</html>
